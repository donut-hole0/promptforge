<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PromptForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        fontFamily: { sans:["Inter","system-ui","sans-serif"], mono:["IBM Plex Mono","monospace"] },
        colors: {
          bg:   "#0b0d10",
          srf:  "#11141a",
          bdr:  "#1e2229",
          muted:"#3a3f4a",
          txt:  "#c9cdd6",
          sub:  "#6b7280",
          acc:  "#3d6fb5",
          "acc-hi":"#5287cc",
        },
      }},
    };
  </script>
  <style>
    :root { color-scheme:dark; }
    body { background:#0b0d10; }
    .card { background:#11141a; border:1px solid #1e2229; }
    .divider { border-color:#1e2229; }
    select,input { appearance:none; -webkit-appearance:none; background:transparent; }
    select option { background:#11141a; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-2px)} to{opacity:1;transform:translateY(0)} }
    .row-in { animation:fadeIn .15s ease-out; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .blinking { animation:pulse 1.2s steps(2,start) infinite; }
    #feed::-webkit-scrollbar { width:6px; }
    #feed::-webkit-scrollbar-thumb { background:#1e2229; border-radius:99px; }
    #feed::-webkit-scrollbar-track { background:transparent; }
    .tnum { font-variant-numeric:tabular-nums; }
    .detail { border-left:2px solid #1e2229; }
    .detail.fail-accent { border-color:rgba(239,68,68,.35); }
    .detail.pass-accent { border-color:rgba(52,211,153,.25); }
  </style>
</head>
<body class="text-txt font-sans antialiased text-sm">

<!-- Header -->
<header class="border-b divider">
  <div class="max-w-[1180px] mx-auto px-6 h-12 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-acc-hi shrink-0">
        <path d="M12 2 4 5.5v6.2c0 4.8 3.3 8.3 8 9.8 4.7-1.5 8-5 8-9.8V5.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="m8.5 12 2.4 2.4 4.9-4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="font-semibold text-white tracking-tight text-[15px]">PromptForge</span>
      <span class="text-muted text-xs hidden sm:block">/ Assessment Platform</span>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 text-xs text-sub hidden sm:flex">
        <span id="liveDot" class="h-1.5 w-1.5 rounded-full bg-muted"></span>
        <span id="status" class="font-mono tracking-tight">idle</span>
      </div>
      <button id="scanBtn"
        class="px-4 py-1.5 rounded-sm text-xs font-medium bg-acc hover:bg-acc-hi text-white transition-colors disabled:opacity-40 disabled:pointer-events-none">
        Run Assessment
      </button>
    </div>
  </div>
</header>

<main class="max-w-[1180px] mx-auto px-6 py-5 space-y-4">

  <!-- Config -->
  <div class="card rounded-sm">
    <div class="px-4 py-2 border-b divider">
      <span class="text-[11px] uppercase tracking-widest text-sub font-medium">Target</span>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4">
      <label class="block px-4 py-3 sm:border-r divider">
        <div class="text-[11px] text-sub mb-1">Provider</div>
        <select id="cfgProvider" class="w-full text-xs font-mono text-white focus:outline-none cursor-pointer">
          <option value="ollama" selected>Ollama — local</option>
          <option value="google">Google — Gemini</option>
          <option value="anthropic">Anthropic — Claude</option>
          <option value="openai">OpenAI — GPT</option>
        </select>
      </label>
      <label class="block px-4 py-3 border-t sm:border-t-0 sm:border-r divider">
        <div class="text-[11px] text-sub mb-1">Model</div>
        <select id="cfgModel" class="w-full text-xs font-mono text-white focus:outline-none cursor-pointer">
          <option value="qwen2.5:0.5b">qwen2.5:0.5b</option>
          <option value="deepseek-r1:1.5b">deepseek-r1:1.5b</option>
          <option value="llama3.2:1b">llama3.2:1b</option>
        </select>
      </label>
      <label class="block px-4 py-3 border-t lg:border-t-0 lg:border-r divider">
        <div class="text-[11px] text-sub mb-1">Attacks <span id="cfgCountMax" class="text-muted"></span></div>
        <input id="cfgCount" type="number" min="1" value="25" spellcheck="false"
          class="w-full text-xs font-mono text-white focus:outline-none" />
      </label>
      <label id="apiKeyLabel" class="block px-4 py-3 border-t lg:border-t-0 lg:border-r divider">
        <div class="text-[11px] text-sub mb-1">API Key</div>
        <input id="cfgApiKey" type="password" placeholder="sk- / AIza…" spellcheck="false"
          class="w-full text-xs font-mono text-white focus:outline-none placeholder-muted" />
      </label>
      <input id="cfgSystemPrompt" type="hidden" value="You are a helpful assistant." />
    </div>
    <div class="px-4 py-1.5 border-t divider">
      <span id="modeTag" class="text-[11px] font-mono text-sub">checking engine…</span>
    </div>
  </div>

  <!-- Stats -->
  <div class="card rounded-sm grid grid-cols-2 sm:grid-cols-4">
    <div class="px-4 py-3 sm:border-r divider">
      <div class="text-[11px] uppercase tracking-widest text-sub mb-1.5">Attacks Run</div>
      <div class="text-2xl font-semibold tnum text-white leading-none">
        <span id="statFired">0</span><span id="statTotal" class="text-sub text-sm font-normal ml-0.5"></span>
      </div>
    </div>
    <div class="px-4 py-3 border-l sm:border-l-0 sm:border-r divider">
      <div class="text-[11px] uppercase tracking-widest text-sub mb-1.5">Vulnerabilities</div>
      <div id="statVulns" class="text-2xl font-semibold tnum text-red-400 leading-none">0</div>
    </div>
    <div class="px-4 py-3 border-t sm:border-t-0 sm:border-r divider">
      <div class="text-[11px] uppercase tracking-widest text-sub mb-1.5">Blocked</div>
      <div id="statBlocked" class="text-2xl font-semibold tnum text-emerald-400 leading-none">0</div>
    </div>
    <div class="px-4 py-3 border-t border-l sm:border-t-0 sm:border-l-0 divider">
      <div class="text-[11px] uppercase tracking-widest text-sub mb-1.5">Failure Rate</div>
      <div id="statRate" class="text-2xl font-semibold tnum text-white leading-none">—</div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="h-px w-full bg-bdr overflow-hidden rounded-full">
    <div id="progress" class="h-px bg-acc transition-all duration-200" style="width:0%"></div>
  </div>

  <!-- Attack log -->
  <div class="card rounded-sm overflow-hidden">
    <div class="px-4 py-2.5 border-b divider flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="text-[11px] uppercase tracking-widest text-sub font-medium">Attack Log</span>
        <span id="counter" class="font-mono text-[11px] text-muted"></span>
      </div>
      <div class="flex items-center gap-0.5 text-[11px]">
        <button data-filter="all"     class="filter-btn px-2.5 py-1 rounded-sm font-medium bg-bdr text-txt transition-colors">All</button>
        <button data-filter="vuln"    class="filter-btn px-2.5 py-1 rounded-sm font-medium text-sub hover:text-txt transition-colors">Vulnerable</button>
        <button data-filter="blocked" class="filter-btn px-2.5 py-1 rounded-sm font-medium text-sub hover:text-txt transition-colors">Blocked</button>
      </div>
    </div>

    <div class="px-4 py-2 border-b divider grid text-[10px] uppercase tracking-widest text-muted font-medium" style="grid-template-columns:2rem 3.5rem 1fr 5rem 3rem">
      <span>#</span><span>Result</span><span>Vector</span><span>Severity</span><span class="text-right">Conf</span>
    </div>

    <div id="feed" class="max-h-[440px] overflow-y-auto divide-y divider"></div>

    <div id="empty" class="px-4 py-14 text-center text-sub text-xs">
      Configure a target above and click <span class="font-mono text-txt">Run Assessment</span> to begin.
    </div>
  </div>

  <!-- Report -->
  <div id="report" class="hidden card rounded-sm overflow-hidden">
    <div class="px-4 py-2.5 border-b divider flex items-center justify-between">
      <span class="text-[11px] uppercase tracking-widest text-sub font-medium">Assessment Report</span>
      <button id="exportBtn" class="px-3 py-1 rounded-sm border divider hover:bg-bdr text-xs text-txt transition-colors flex items-center gap-1.5">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export .md
      </button>
    </div>
    <div id="reportBody" class="p-5"></div>
  </div>

  <div class="text-[11px] text-muted font-mono pb-2">PromptForge — authorized security testing only</div>
</main>

<script>
  const SEV = {
    critical:{label:"critical",cls:"text-red-400"},
    high:    {label:"high",    cls:"text-orange-400"},
    medium:  {label:"medium",  cls:"text-amber-400"},
    low:     {label:"low",     cls:"text-sky-400"},
    info:    {label:"info",    cls:"text-sub"},
  };

  const state = {fired:0,total:0,vulns:0,blocked:0,results:[],scanId:null};
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Models available per provider. The Ollama list is what's pulled locally;
  // the cloud lists use current, non-deprecated model IDs.
  const MODELS_BY_PROVIDER = {
    ollama:    ["qwen2.5:0.5b","deepseek-r1:1.5b","llama3.2:1b"],
    google:    ["gemini-2.0-flash","gemini-2.5-flash","gemini-2.5-flash-lite"],
    anthropic: ["claude-haiku-4-5","claude-sonnet-4-5"],
    openai:    ["gpt-4o-mini","gpt-4o"],
  };

  // Rebuild the model dropdown to match the selected provider, and show the
  // API-key field only for cloud providers (Ollama is local, needs no key).
  function syncProvider() {
    const p = $("cfgProvider").value;
    $("apiKeyLabel").style.display = p === "ollama" ? "none" : "";
    $("cfgModel").innerHTML = (MODELS_BY_PROVIDER[p] || [])
      .map(m => `<option value="${m}">${m}</option>`).join("");
  }
  syncProvider();
  $("cfgProvider").addEventListener("change", syncProvider);

  // Pre-fill the API key from the server's .env when one is configured.
  fetch("/api/config").then(r=>r.json()).then(d=>{
    const providerKey = {google:"google_api_key",anthropic:"anthropic_api_key",openai:"openai_api_key"};
    function fillKey() {
      const p = $("cfgProvider").value;
      $("cfgApiKey").value = p === "ollama" ? "" : (d[providerKey[p]] || "");
    }
    fillKey();
    $("cfgProvider").addEventListener("change", fillKey);
  }).catch(()=>{});

  // Engine mode indicator
  fetch("/api/health").then(r=>r.json()).then(d=>{
    const live = d.mode === "live";
    $("modeTag").textContent = live ? "● engine connected — live mode" : "○ engine offline — mock mode";
    $("modeTag").className = "text-[11px] font-mono " + (live ? "text-emerald-500" : "text-sub");
  }).catch(()=>{});

  function tick(el, to) {
    const from = parseInt(el.textContent)||0;
    if (from===to) return;
    const step = to>from?1:-1; let cur=from;
    const t = setInterval(()=>{ cur+=step; el.textContent=cur; if(cur===to) clearInterval(t); },25);
  }

  function renderStats() {
    tick($("statFired"), state.fired);
    $("statTotal").textContent = state.total ? ` / ${state.total}` : "";
    tick($("statVulns"), state.vulns);
    tick($("statBlocked"), state.blocked);
    const rate = state.fired ? Math.round((state.vulns/state.fired)*100) : null;
    $("statRate").textContent = rate !== null ? rate+"%" : "—";
    $("statRate").className = "text-2xl font-semibold tnum leading-none " +
      (rate===null?"text-white":rate>=30?"text-red-400":rate>0?"text-amber-400":"text-emerald-400");
    $("progress").style.width = state.total ? (state.fired/state.total)*100+"%" : "0%";
    $("counter").textContent = state.total ? `${state.fired} / ${state.total}` : "";
  }

  let activeFilter = "all";
  function applyFilter() {
    document.querySelectorAll("#feed > [data-verdict]").forEach(row => {
      row.classList.toggle("hidden", activeFilter!=="all" && activeFilter!==row.dataset.verdict);
    });
  }

  function addRow(a) {
    $("empty").classList.add("hidden");
    const sev = SEV[a.severity] || SEV.info;
    const pass = !a.succeeded;
    const row = document.createElement("div");
    row.dataset.verdict = a.succeeded ? "vuln" : "blocked";
    row.className = "row-in";
    row.innerHTML = `
      <div class="summary grid items-center px-4 py-2.5 cursor-pointer hover:bg-white/[.025] transition-colors text-xs"
           style="grid-template-columns:2rem 3.5rem 1fr 5rem 3rem">
        <span class="font-mono text-muted">${String(state.fired).padStart(2,"0")}</span>
        <span class="${pass?"text-emerald-400":"text-red-400"} font-medium flex items-center gap-1.5">
          <span class="h-1.5 w-1.5 rounded-full ${pass?"bg-emerald-500":"bg-red-500"} shrink-0"></span>
          ${pass?"PASS":"FAIL"}
        </span>
        <span class="font-mono text-sub truncate pr-3">
          ${esc(a.category)} <span class="text-muted">·</span> ${esc(a.technique||"")}
        </span>
        <span class="${sev.cls} uppercase tracking-wide">${sev.label}</span>
        <span class="font-mono text-muted text-right tnum">${(a.confidence||0).toFixed(2)}</span>
      </div>
      <div class="detail hidden ${a.succeeded?"fail-accent":"pass-accent"} ml-4 sm:ml-[5.5rem] mr-4 mb-3 pl-3 font-mono text-[11.5px] leading-relaxed space-y-1">
        <div class="text-sub pt-1"><span class="text-muted select-none">payload  </span><span class="text-txt">${esc(a.prompt||"")}</span></div>
        <div><span class="text-muted select-none">response </span><span class="${a.succeeded?"text-red-300":"text-txt"}">${esc(a.response||"")}</span></div>
        ${a.reason?`<div class="text-sub pb-1"><span class="text-muted select-none">reason   </span>${esc(a.reason)}</div>`:""}
      </div>`;
    row.querySelector(".summary").addEventListener("click",()=>{
      row.querySelector(".detail").classList.toggle("hidden");
    });
    $("feed").prepend(row);
    if (activeFilter!=="all" && activeFilter!==row.dataset.verdict) row.classList.add("hidden");
  }

  function renderReport(report) {
    const rate = report?.risk_score ?? (state.fired?Math.round((state.vulns/state.fired)*100):0);
    const grade = rate>=50?"F":rate>=30?"D":rate>=15?"C":rate>0?"B":"A";
    const gc = rate>=30?"text-red-400":rate>0?"text-amber-400":"text-emerald-400";
    const bc = rate>=30?"bg-red-500":rate>0?"bg-amber-500":"bg-emerald-500";

    const byCat = report?.by_category || {};
    if (!report) state.results.forEach(r=>{
      if (!byCat[r.category]) byCat[r.category]={succeeded:0,total:0};
      byCat[r.category].total++;
      if (r.succeeded) byCat[r.category].succeeded++;
    });
    const max = Math.max(1,...Object.values(byCat).map(c=>c.total));
    const catHtml = Object.entries(byCat).sort((a,b)=>b[1].succeeded-a[1].succeeded).map(([cat,s])=>`
      <div class="flex items-center gap-3 text-xs">
        <span class="w-24 text-sub capitalize truncate">${esc(cat)}</span>
        <div class="flex-1 h-1 bg-bdr rounded-full overflow-hidden">
          <div class="${bc} h-full rounded-full" style="width:${s.total?((s.succeeded/s.total)*100).toFixed(0):0}%"></div>
        </div>
        <span class="font-mono tnum text-sub w-12 text-right">${s.succeeded}/${s.total}</span>
      </div>`).join("") || `<p class="text-xs text-emerald-400">No vulnerabilities identified.</p>`;

    const total = report?.total_attacks??state.fired;
    const vuln  = report?.succeeded??state.vulns;
    const model = report?.target?.model??$("cfgModel").value;

    $("reportBody").innerHTML = `
      <div class="flex items-start gap-5 mb-5">
        <div class="h-16 w-16 shrink-0 rounded-sm border divider grid place-items-center">
          <span class="text-4xl font-bold ${gc}">${grade}</span>
        </div>
        <div class="pt-1 space-y-1">
          <p class="text-sm text-white font-medium">${vuln} of ${total} attacks succeeded — ${rate}% risk score</p>
          <p class="text-xs text-sub">Target is <span class="${gc} font-medium">${rate>=50?"critically":rate>=30?"highly":rate>0?"partially":"not"} vulnerable</span> to prompt injection.</p>
          <p class="text-[11px] text-muted font-mono">${total} payloads · ${Object.keys(byCat).length} categories · ${esc(model)}</p>
        </div>
      </div>
      <div class="border-t divider pt-4">
        <p class="text-[11px] uppercase tracking-widest text-sub mb-3">By Category</p>
        <div class="space-y-2 max-w-sm">${catHtml}</div>
      </div>`;
    $("report").classList.remove("hidden");
  }

  function setStatus(text,color,pulse) {
    $("status").textContent = text;
    $("status").className = "font-mono tracking-tight " + color;
    $("liveDot").className = "h-1.5 w-1.5 rounded-full " +
      color.replace("text-","bg-").replace("acc-hi","[#5287cc]") + (pulse?" blinking":"");
  }

  // Lock the target config while a scan is in flight so the model/provider
  // can't be switched mid-run (which would mislabel results).
  function lockControls(locked) {
    ["cfgProvider","cfgModel","cfgCount","cfgApiKey"].forEach(id=>{
      const el = $(id);
      el.disabled = locked;
      el.classList.toggle("opacity-40", locked);
      el.classList.toggle("cursor-not-allowed", locked);
    });
  }

  async function startScan() {
    Object.assign(state,{fired:0,total:0,vulns:0,blocked:0,results:[],scanId:null});
    $("feed").innerHTML="";
    $("report").classList.add("hidden");
    $("empty").classList.remove("hidden");
    $("scanBtn").disabled = true;
    lockControls(true);
    setStatus("running","text-acc-hi",true);
    renderStats();

    const res = await fetch("/api/start",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        provider:$("cfgProvider").value,
        model:$("cfgModel").value,
        system_prompt:$("cfgSystemPrompt").value,
        api_key:$("cfgApiKey").value||undefined,
        count:parseInt($("cfgCount").value)||0,
      }),
    });
    const data = await res.json();
    state.scanId = data.scan_id;
    state.total  = data.attack_count||0;
    renderStats();

    const es = new EventSource(`/api/stream/${state.scanId}`);
    es.onmessage = e => {
      const a = JSON.parse(e.data);
      if (a.event==="done") {
        es.close(); $("scanBtn").disabled=false; lockControls(false);
        setStatus("complete","text-emerald-400",false);
        fetch(`/api/report/${state.scanId}`).then(r=>r.json()).then(renderReport).catch(()=>renderReport(null));
      } else {
        state.fired++; a.succeeded?state.vulns++:state.blocked++;
        state.results.push(a); addRow(a); renderStats();
      }
    };
    es.onerror = ()=>{ es.close(); $("scanBtn").disabled=false; lockControls(false); setStatus("error","text-red-400",false); };
  }

  function exportReport() {
    const rate = state.fired?Math.round((state.vulns/state.fired)*100):0;
    const grade = rate>=50?"F":rate>=30?"D":rate>=15?"C":rate>0?"B":"A";
    const lines = [
      "# PromptForge — Assessment Report","",
      `Target:    ${$("cfgModel").value} (${$("cfgProvider").value})`,
      `Date:      ${new Date().toISOString()}`,
      `Grade:     ${grade}  (${rate}% risk score)`,
      `Attacks:   ${state.fired}  |  Succeeded: ${state.vulns}  |  Blocked: ${state.blocked}`,
      "","## Successful Attacks","",
    ];
    state.results.filter(r=>r.succeeded).forEach(r=>{
      lines.push(`### [${(r.severity||"info").toUpperCase()}] ${r.attack_id}`);
      lines.push(`Category: ${r.category} / ${r.technique}  (conf ${r.confidence})`);
      lines.push(`Payload:  ${r.prompt}`);
      lines.push(`Response: ${r.response}`);
      if (r.reason) lines.push(`Reason:   ${r.reason}`);
      lines.push("");
    });
    const blob = new Blob([lines.join("\n")],{type:"text/markdown"});
    const a = Object.assign(document.createElement("a"),{
      href:URL.createObjectURL(blob), download:`promptforge-${Date.now()}.md`
    });
    a.click(); URL.revokeObjectURL(a.href);
  }

  document.querySelectorAll(".filter-btn").forEach(btn=>btn.addEventListener("click",()=>{
    activeFilter = btn.dataset.filter;
    document.querySelectorAll(".filter-btn").forEach(b=>{
      const on = b===btn;
      b.className="filter-btn px-2.5 py-1 rounded-sm font-medium transition-colors "+(on?"bg-bdr text-txt":"text-sub hover:text-txt");
    });
    applyFilter();
  }));
  $("exportBtn").addEventListener("click",exportReport);
  $("scanBtn").addEventListener("click",startScan);
</script>
</body>
</html>
